<svg width="1600" height="620" viewBox="0 0 1600 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">CodexAgentTeam native data model</title>
  <desc id="description">CodexAgentTeam manages Team registration, member identity, directories, and routing while Codex owns projects, threads, history, tools, approvals, models, and runtime state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F5FF"/>
      <stop offset="0.52" stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#FFF7F2"/>
    </linearGradient>
    <linearGradient id="team" x1="575" y1="120" x2="1025" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7267F0"/>
      <stop offset="1" stop-color="#4E8CEB"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#3A4160" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A91A4"/>
    </marker>
  </defs>

  <rect width="1600" height="620" rx="36" fill="url(#bg)"/>
  <text x="800" y="64" text-anchor="middle" fill="#24283A" font-size="25" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">A thin team layer. Native Codex underneath.</text>

  <g filter="url(#shadow)">
    <rect x="92" y="154" width="346" height="312" rx="26" fill="white" fill-opacity="0.92"/>
    <rect x="92.75" y="154.75" width="344.5" height="310.5" rx="25.25" stroke="#CFD4E2" stroke-width="1.5"/>
  </g>
  <circle cx="145" cy="210" r="25" fill="#756AF2" fill-opacity="0.12"/>
  <path d="M133 210H157M145 198V222" stroke="#7167ED" stroke-width="3" stroke-linecap="round"/>
  <text x="188" y="218" fill="#25293A" font-size="24" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">CodexAgentTeam</text>
  <g fill="#5F6678" font-size="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="130" y="278">Team registration and members</text>
    <text x="130" y="325">Role, avatar and directories</text>
    <text x="130" y="372">Explicit one-hop routing</text>
    <text x="130" y="419">Global dashboard projection</text>
  </g>
  <g fill="#7167ED">
    <circle cx="111" cy="272" r="4"/>
    <circle cx="111" cy="319" r="4"/>
    <circle cx="111" cy="366" r="4"/>
    <circle cx="111" cy="413" r="4"/>
  </g>

  <path d="M454 310H555" stroke="#8A91A4" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="505" y="286" text-anchor="middle" fill="#747B8E" font-size="15" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">binds</text>

  <g filter="url(#shadow)">
    <rect x="575" y="120" width="450" height="380" rx="30" fill="url(#team)"/>
  </g>
  <text x="800" y="180" text-anchor="middle" fill="white" font-size="26" font-weight="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Native Codex Team</text>
  <text x="800" y="212" text-anchor="middle" fill="white" fill-opacity="0.75" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">backed by one native Project identifier</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="625" y="254" width="350" height="62" rx="18" fill="white" fill-opacity="0.14"/>
    <circle cx="661" cy="285" r="17" fill="#FFD36B"/>
    <text x="661" y="291" text-anchor="middle" fill="#4D3C12" font-size="14" font-weight="800">P</text>
    <text x="696" y="291" fill="white" font-size="18" font-weight="650">Product · native Thread</text>

    <rect x="625" y="331" width="350" height="62" rx="18" fill="white" fill-opacity="0.14"/>
    <circle cx="661" cy="362" r="17" fill="#FFA784"/>
    <text x="661" y="368" text-anchor="middle" fill="#5C2516" font-size="14" font-weight="800">F</text>
    <text x="696" y="368" fill="white" font-size="18" font-weight="650">Frontend · native Thread</text>

    <rect x="625" y="408" width="350" height="62" rx="18" fill="white" fill-opacity="0.14"/>
    <circle cx="661" cy="439" r="17" fill="#8BD0FF"/>
    <text x="661" y="445" text-anchor="middle" fill="#173A55" font-size="14" font-weight="800">B</text>
    <text x="696" y="445" fill="white" font-size="18" font-weight="650">Backend · native Thread</text>
  </g>

  <path d="M1045 310H1146" stroke="#8A91A4" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="1095" y="286" text-anchor="middle" fill="#747B8E" font-size="15" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">runs on</text>

  <g filter="url(#shadow)">
    <rect x="1162" y="154" width="346" height="312" rx="26" fill="white" fill-opacity="0.92"/>
    <rect x="1162.75" y="154.75" width="344.5" height="310.5" rx="25.25" stroke="#CFD4E2" stroke-width="1.5"/>
  </g>
  <circle cx="1215" cy="210" r="25" fill="#4E8CEB" fill-opacity="0.12"/>
  <path d="M1204 210L1212 218L1227 201" stroke="#4E8CEB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1258" y="218" fill="#25293A" font-size="24" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Codex owns</text>
  <g fill="#5F6678" font-size="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="1200" y="278">Conversation history</text>
    <text x="1200" y="325">Turns, tools and approvals</text>
    <text x="1200" y="372">Models and reasoning effort</text>
    <text x="1200" y="419">Runtime and attention state</text>
  </g>
  <g fill="#4E8CEB">
    <circle cx="1181" cy="272" r="4"/>
    <circle cx="1181" cy="319" r="4"/>
    <circle cx="1181" cy="366" r="4"/>
    <circle cx="1181" cy="413" r="4"/>
  </g>

  <rect x="488" y="548" width="624" height="40" rx="20" fill="#24283A" fill-opacity="0.06"/>
  <text x="800" y="574" text-anchor="middle" fill="#656D80" font-size="15" font-weight="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">No copied chat history · no Task database · no second chat UI · no automatic agent loops</text>
</svg>
